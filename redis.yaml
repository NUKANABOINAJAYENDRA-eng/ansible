- name: install redis components
  hosts: redis
  become: yes
  tasks:
  - name: install redis repo
    ansible.builtin.yum:
    name: https://rpms.remirepo.net/enterprise/remi-release-8.rpm -y
    state: installed
    disable_gpg_check: true
  

  - name: Enable redis
    ansible.builtin.command: module enable redis:remi-6.2 -y


  - name: Install redis
    ansible.builtin.yum:
     name: redis
     state: installed
     