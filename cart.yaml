- name: Install cart component
  hosts: cart
  become: yes
  tasks:
  - name: setup NPM source
    ansible.builtin.shell: "curl -sL https://rpm.nodesource.com/setup_lts.x | bash"


  - name: install Nodejs
    ansible.builtin.yum:
     name: nodejs
     state: present


  - name: check roboshop user exist or not
    ansible.builtin.command: id roboshop
    register: out #output is a variable name
    ignore_errors: true


  #- when: out.rc != 0
    name: create user roboshop
    become: yes #we need sudo access for this task only
    ansible.builtin.user:
     name: roboshop

  - name: Create /app directory if it does not exist
    ansible.builtin.file:
     path: /app
     state: directory
     mode: '0755'


  - name: check /app directory exist or not
    ansible.builtin.stat:
     path: /app
    register: directory

  - name: print the directory stats
    ansible.builtin.debug:
     msg: "output: {{directory}}"



#write this only when directory.stat.exist == 'Flase' othere wise don't use this
#  - when: directory.stat.exist == Flase
#   name: create /app directory
#   ansible.builtin.file:
#    path: /app
#    state: directory
  

  - name: download cart artifact
    ansible.builtin.get_url:
     url: https://roboshop-builds.s3.amazonaws.com/cart.zip
     dest: /tmp
  

  - name: Install unzip package
    ansible.builtin.yum:
     name: unzip
     state: present
    become: true

  
  - name: extract cart artifact
    ansible.builtin.unarchive:
     src: /tmp/cart.zip
     dest: /app
     remote_src: yes

  - name: install dependencies
    ansible.builtin.command: npm install
    args: 
     chdir: /app

  - name: copy cart service
    ansible.builtin.copy:
     src: /app/cart-main/cart.service
     dest: /etc/systemd/system/cart.service
     remote_src: true
    become: true
     

  - name: demon reload
    ansible.builtin.systemd:
     demon_reload: true

  - name: restart cart
    ansible.builtin.service:
     name: cart
     state: restarted
     enabled: true