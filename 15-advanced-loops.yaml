- name: install packages
  hosts: mongodb
  become: yes
  tasks:
  - name: install packages
    ansible.builtin.yum:
      name: "{{ item.name }}"
      state: "{{ item.state }}"
      # list of map
    loop:
    - { name: 'nginx', state: 'absent' }
    - { name: 'postfix', state: 'present' }
    - { name: 'maven', state: 'present'}