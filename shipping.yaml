- name: install shipping component
  hosts: shipping
  become: yes
  tasks: 
  - name: install maven
    ansible.builtin.yum:
     name: maven
     state: installed


 
  - name: check roboshop user exist or not
    ansible.builtin.command: id roboshop
    register: out #output is a variable name
    ignore_errors: true


  - when: out.rc != 0
    name: create user roboshop
    become: yes #we need sudo access for this task only
    ansible.builtin.user:
     name: roboshop

  - name: check /app directory exist or not
    ansible.builtin.stat:
     path: /app
    register: directory

  - name: print the directory stats
    ansible.builtin.debug:
     msg: "output: {{directory}}"



#write this only when directory.stat.exist == 'Flase' othere wise don't use this
#  - when: directory.stat.exist == Flase
#   name: create /app directory
#   ansible.builtin.file:
#    path: /app
#    state: directory

  - name: download shhiping and extract
    ansible.builtin.unarchive:
     src: https://roboshop-builds.s3.amazonaws.com/shipping.zip
     dest: /app
     remote_src: yes


  - name: maven package
    ansible.builtin.command: mvn clean package
    args: 
     chdir: /app

  - name: copy shipping service
    ansible.builtin.copy:
     src: shipping.service
     dest: /etc/systemd/system/shhiping.service


   - name: restart shipping
    ansible.builtin.service:
     name: shipping
     state: restarted
     enabled: true

  -  name: install mysql client
     ansible.builtin.yum:
      name: musql
      state: installed

  - name: load mysql schema
    ansible.builtin.shell: mysql -h <MYSQL-SERVER-IPADDRESS> -uroot -pRoboShop@1 < /app/schema/shipping.sql 

  - name: restart shipping
    ansible.builtin.service:
     name: shipping
     state: restarted
     enabled: true



